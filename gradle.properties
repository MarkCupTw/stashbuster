# --- Gradle 运行参数 ---
# NeoForge 首次构建需要反编译 Minecraft，给足堆内存
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- 版本（均已核对可用） ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.245
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- Mod 元数据 ---
mod_id=stashbuster
mod_name=Stash Buster
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.stashbuster
mod_authors=OMarkCupTwO
mod_description=Creepers stop chasing you and start hunting your stash - each one picks the player-placed container holding the most items and blows it open.
